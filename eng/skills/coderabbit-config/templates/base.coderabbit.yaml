# CodeRabbit configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/reference/configuration
# Generated by the coderabbit-config skill. Edit freely.

language: "en-US"

# Tone is global. Keep under 250 chars. Lift voice rules from CLAUDE.md when possible.
tone_instructions: ""

early_access: false

reviews:
  # "chill" = bugs/security/logic only, quiet on style. "assertive" = full critique.
  profile: "chill"

  # Auto-approve when all comments are resolved. Off by default; opt in when team trusts CR.
  request_changes_workflow: false

  high_level_summary: true
  poem: false  # noise for serious repos; flip on for fun side projects.
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: true
  assess_linked_issues: true
  suggested_reviewers: true
  auto_apply_labels: false

  # Negation patterns exclude paths from review. Populated by the skill from repo scan.
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/__pycache__/**"
    - "!**/coverage/**"
    - "!**/.next/**"
    - "!**/.nuxt/**"
    - "!**/vendor/**"

  # Path-scoped natural-language instructions. One entry per real convention.
  # Skill lifts these from CLAUDE.md / AGENTS.md / .cursorrules where applicable.
  path_instructions: []

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  # Linter integrations. Skill enables based on detected languages.
  # Full list: ruff, eslint, biome, pylint, semgrep, trivy, hadolint, shellcheck,
  # markdownlint, yamllint, golangci-lint, rubocop, gitleaks, ...
  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000

  finishing_touches:
    docstrings:
      enabled: false  # opt in; can be noisy.
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
  code_guidelines:
    enabled: true
    # Skill adds CLAUDE.md / AGENTS.md / .cursorrules paths here if present.
    filePatterns: []
