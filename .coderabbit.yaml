# CodeRabbit configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/reference/configuration
# Generated by the coderabbit-config skill. Edit freely.

language: "en-US"

# Voice rules lifted from CLAUDE.md and ~/.claude/CLAUDE.md.
tone_instructions: "Direct, terse feedback. Never use em-dash characters (U+2014); flag any that slip in. Match the existing skill-author voice: concise, opinionated, low-ceremony."

early_access: false

reviews:
  profile: "assertive"

  request_changes_workflow: false

  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: true
  assess_linked_issues: true
  suggested_reviewers: true
  auto_apply_labels: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/out/**"
    - "!**/.next/**"
    - "!**/.turbo/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/.venv/**"
    - "!**/venv/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!**/vendor/**"

  path_instructions:
    - path: "**/*"
      instructions: "Flag any em-dash character (U+2014). Project convention bans them globally; suggest period, comma, colon, semicolon, parentheses, or hyphen instead."
    - path: "skills/**/SKILL.md"
      instructions: "Every SKILL.md must have YAML frontmatter with `name` (matching the parent directory) and `description` (the triggering blurb). Flag missing or stale `description` fields, since description is the only text Claude sees when deciding to trigger the skill."
    - path: "**/SKILL.md"
      instructions: "Flag SKILL.md bodies that bury the executable contract under prose. The body is the contract Claude follows; keep it terse and load-bearing. Long-form material belongs in a sibling `references/` directory."
    - path: "LOG.md"
      instructions: "LOG.md is a narrative decision log, not a changelog. Flag entries that just restate a commit message, log routine typo fixes, or omit the `### [topic][subtopic] Short title` format. Dates must be absolute (`## YYYY-MM-DD`)."
    - path: "INDEX.md"
      instructions: "INDEX.md is a where-do-I-find-X catalog. Flag attempts to enumerate every file in every skill; only list artifacts a future session would benefit from finding without hunting."
    - path: "install"
      instructions: "The install script symlinks `skills/<name>/` into `~/.claude/skills/`. Flag changes that would touch files outside this repo's own symlinks, edit gstack's own skills, or break the uninstall script's ability to remove only this repo's symlinks."
    - path: "uninstall"
      instructions: "uninstall must remove only symlinks that point into this repo. Flag any logic that could remove unrelated entries in `~/.claude/skills/`."

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - "README.md"
      - "skills/**/SKILL.md"
